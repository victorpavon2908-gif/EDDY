name: EDDY web companion tests
on:
  push:
    branches: [main, leo-v2-staging]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm run lint
      - run: npm run build
      - run: npm run measure
