name: EDDY v0.4.3 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Run backend tests
        run: pytest -q backend

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload EDDY v0.4.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: EDDY-v0.4.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
