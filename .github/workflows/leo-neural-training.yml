name: LEO Neural Core training experiment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/leo-neural-training.yml'
      - 'scripts/*neural*'
      - 'scripts/EvaluateLeoCandidate.kt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/leo-neural-training.yml'
      - 'scripts/finetune_leo_neural_core.py'
      - 'scripts/leo_neural_*.json'
      - 'scripts/*neural*'
      - 'scripts/EvaluateLeoCandidate.kt'

permissions:
  contents: read

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install training-only dependencies
        run: |
          python -m pip install 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.2.6'
      - name: Test loading, real gradient updates and evaluation gates
        run: |
          python scripts/validate_leo_microgpt_assets.py
          python scripts/test_neural_training.py
          python scripts/test_neural_scoring.py
      - name: Fine-tune existing weights without replacing the app model
        run: python -u scripts/finetune_leo_neural_core.py --steps 3200
      - name: Prepare the Kotlin compiler
        run: ./gradlew --version
      - name: Evaluate the exported INT8 file with the Android Kotlin decoder
        run: bash scripts/test_neural_candidate.sh build/leo-neural-candidate/leo-neural-core-candidate.bundle > build/leo-neural-candidate/runtime.tsv
      - name: Record quality decision (rejection is an experimental result)
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'scripts')
          from score_neural_candidate import score
          root = pathlib.Path('build/leo-neural-candidate')
          result = score((root / 'runtime.tsv').read_text())
          (root / 'runtime-report.json').write_text(json.dumps(result, ensure_ascii=False, indent=2))
          decision = 'PASSED LIMITED WORDING GATE; NOT ACTIVATED' if result['passed'] else 'REJECTED FOR ACTIVATION'
          (root / 'DECISION.txt').write_text(decision + '\nThis is an experimental small decoder, not a general knowledge model. No APK or installed model was modified.\n')
          print(decision)
          print(f"Approved wording: {result['approved_wording']}/{result['cases']}")
          PY
      - name: Retain candidate and actual evidence for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leo-neural-experiment-${{ github.sha }}
          path: build/leo-neural-candidate/
          if-no-files-found: error
          retention-days: 30
